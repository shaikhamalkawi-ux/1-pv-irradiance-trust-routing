name: SRRL MIDC pre-outcome schema gate

on:
  push:
    paths:
      - 'protocols/SRRL_MIDC_EXTERNAL_TRANSFER_FROZEN_v1.md'
      - 'config/srrl_midc_frozen_config.json'
      - 'analysis/probe_srrl_midc_schema.py'
      - '.github/workflows/srrl-midc-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe public MIDC schema only
        run: |
          set -o pipefail
          mkdir -p results/srrl_midc_schema
          python analysis/probe_srrl_midc_schema.py 2>&1 | tee results/srrl_midc_schema/schema_stdout.log
      - name: Hash protocol and code
        run: |
          sha256sum \
            protocols/SRRL_MIDC_EXTERNAL_TRANSFER_FROZEN_v1.md \
            config/srrl_midc_frozen_config.json \
            analysis/probe_srrl_midc_schema.py \
            requirements.txt \
            > results/srrl_midc_schema/source_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: srrl-midc-schema-gate
          path: results/srrl_midc_schema
          if-no-files-found: error
          retention-days: 30
